name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dev-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: node --test 'plugins/dev-skills/extensions/*.test.ts' 'plugins/dev-skills/skills/*/*.test.ts'
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: node --test scripts/setup.test.ts
  fitness:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fitness
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run fitness -- check --fail
